name: Release candidate gates

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests, build, Prisma, and migrations
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend install
        working-directory: backend
        run: npm ci
      - name: Backend tests
        working-directory: backend
        run: npm test
      - name: Backend build
        working-directory: backend
        run: npm run build
      - name: Prisma schema validation
        working-directory: backend
        run: npx prisma validate --schema prisma/schema.prisma
      - name: Disposable migration verification
        run: bash scripts/ci/verify-migrations.sh

  frontend:
    name: Frontend tests, lint, and build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Install Chromium for the configured browser tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend build
        working-directory: frontend
        run: npm run build

  production-compose:
    name: Production images, Compose config, and isolated smoke
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: ci_smoke
      BETTER_AUTH_SECRET: ci-only-secret
      ENVIRONMENT: test
      FRONTEND_URL: http://127.0.0.1:8080
      BETTER_AUTH_URL: http://127.0.0.1:8080
      VITE_API_BASE_URL: http://127.0.0.1:8080
      BOOK_FILE_STORAGE_ROOT: /tmp/belib-ci-storage
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate production Compose
        run: docker compose --file compose.yaml config
      - name: Build production images
        run: docker compose --file compose.yaml build
      - name: Isolated API and UI smoke
        run: bash scripts/ci/isolated-smoke.sh
