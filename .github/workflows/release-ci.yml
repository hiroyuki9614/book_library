name: Release candidate gates

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests, build, Prisma, and migrations
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend install
        working-directory: backend
        run: npm ci
      - name: Backend tests
        working-directory: backend
        run: npm test
      - name: Backend build
        working-directory: backend
        run: npm run build
      - name: Prisma schema validation
        working-directory: backend
        run: npx prisma validate --schema prisma/schema.prisma
      - name: Disposable migration verification
        run: bash scripts/ci/verify-migrations.sh

  frontend:
    name: Frontend tests, lint, and build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Install Chromium for the configured browser tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Japanese fonts for vertical layout regression
        # Playwright's --with-deps step already refreshes the package lists.
        run: sudo apt-get install -y --no-install-recommends -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 fonts-noto-cjk
      - name: Real EPUB and PDF rendering regression
        working-directory: frontend
        run: npm run test:readers
      - name: Retain reader rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-rendering-evidence
          path: frontend/test-results
          retention-days: 7
      - name: Frontend node-side asset and fixture tests
        working-directory: frontend
        run: npm run test:node
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend build
        working-directory: frontend
        run: npm run build

  reader-e2e:
    name: Reader Playwright E2E
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: reader_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d reader_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://ci:ci-only-password@127.0.0.1:5432/reader_e2e
      E2E_ADMIN_EMAIL: admin-e2e@example.com
      E2E_ADMIN_NAME: E2E Administrator
      E2E_ADMIN_PASSWORD: ci-admin-password-42
      E2E_MVP_PASSWORD: ci-demo-password-42
      E2E_BOOK_FILE_STORAGE_ROOT: /tmp/belib-reader-e2e-storage
      E2E_MVP_METADATA_PATH: /tmp/belib-reader-e2e-metadata.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend install
        working-directory: backend
        run: npm ci
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run isolated reader E2E
        working-directory: frontend
        run: npm run test:e2e
      - name: Retain real API reader evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-api-evidence
          path: frontend/test-results
          retention-days: 7

  production-compose:
    name: Production images, Compose config, and isolated smoke
    runs-on: ubuntu-24.04
    needs: [backend, frontend, reader-e2e]
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: ci_smoke
      BETTER_AUTH_SECRET: ci-only-secret
      ENVIRONMENT: test
      FRONTEND_URL: http://127.0.0.1:8080
      BETTER_AUTH_URL: http://127.0.0.1:8080
      VITE_API_BASE_URL: http://127.0.0.1:8080
      BOOK_FILE_STORAGE_DRIVER: local
      BOOK_FILE_STORAGE_ROOT: /tmp/belib-ci-storage
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate production Compose
        run: |
          echo "VCS_REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          VCS_REF=$(git rev-parse HEAD) docker compose --file compose.yaml config --quiet
      - name: Build production images
        run: docker compose --file compose.yaml build
      - name: Isolated API and UI smoke
        run: bash scripts/ci/isolated-smoke.sh
