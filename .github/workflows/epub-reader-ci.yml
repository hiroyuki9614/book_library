name: EPUB protected reader CI

on:
  pull_request:
    paths:
      - 'backend/src/routes/books/**'
      - 'frontend/src/api/books*'
      - 'frontend/src/pages/ReaderPage/**'
      - 'frontend/src/pages/ReaderPageT/**'
      - 'frontend/src/features/components/EpubReader/**'
      - 'frontend/tsconfig.epub.json'
      - '.github/workflows/epub-reader-ci.yml'

permissions:
  contents: read

jobs:
  epub-reader:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Backend install
        working-directory: backend
        run: npm ci

      - name: Backend EPUB tests
        working-directory: backend
        run: npm run test -- src/routes/books/routes.epub.test.ts src/routes/books/routes.test.ts

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Frontend EPUB tests
        working-directory: frontend
        run: npm run test -- src/api/books.epub.test.ts src/api/books.test.ts src/pages/ReaderPage/index.test.tsx src/features/components/EpubReader/index.test.tsx

      - name: Focused EPUB typecheck
        working-directory: frontend
        run: npx tsc -p tsconfig.epub.json --noEmit

      - name: Frontend bundle build
        working-directory: frontend
        run: npx vite build
