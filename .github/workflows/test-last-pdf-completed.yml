name: Test-Last PDF completed transition

on:
  push:
    branches:
      - test/test-last-pdf-completed-20260823
  pull_request:
    branches:
      - feat/pdf-completed-auto-transition-20260816
  workflow_dispatch:

jobs:
  focused-test-last:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact test evidence head
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Vitest browser mode
        run: npx playwright install --with-deps chromium
      - name: Run focused Test-Last case
        run: npm run test -- src/features/components/PdfReader/index.test.tsx
