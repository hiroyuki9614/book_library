# Standalone, explicitly selected non-production Compose project.
# Never combine this file with compose.yaml or production env files.
name: belib-isolated-i5

services:
  db:
    image: postgres:16.14-bookworm
    environment:
      POSTGRES_USER: belib_staging
      POSTGRES_DB: belib_staging
      POSTGRES_PASSWORD: ${BELIB_STAGE_DB_PASSWORD:?Set staging-only DB password}
    volumes:
      - staging-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belib_staging -d belib_staging"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [isolated]

  migrate:
    profiles: ["migration"]
    build:
      context: ./backend
      target: migration
    user: node
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://belib_staging:${BELIB_STAGE_DB_PASSWORD:?Set staging-only DB password}@db:5432/belib_staging
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [isolated]

  backend:
    build:
      context: ./backend
      target: runtime
      args:
        VCS_REF: ${BELIB_STAGE_VCS_REF:?Set full reviewed staging SHA}
    environment:
      DATABASE_URL: postgresql://belib_staging:${BELIB_STAGE_DB_PASSWORD:?Set staging-only DB password}@db:5432/belib_staging
      APP_PORT: "3000"
      ENVIRONMENT: test
      FRONTEND_URL: http://127.0.0.1:${BELIB_STAGE_PORT:?Set free i5 loopback port}
      BETTER_AUTH_URL: http://127.0.0.1:${BELIB_STAGE_PORT:?Set free i5 loopback port}
      BETTER_AUTH_SECRET: ${BELIB_STAGE_AUTH_SECRET:?Set staging-only Better Auth secret}
      BOOK_FILE_STORAGE_DRIVER: local
      BOOK_FILE_STORAGE_ROOT: /var/lib/belib/books
      # No R2 settings: synthetic books stay on this isolated local volume.
    volumes:
      - staging-book-files:/var/lib/belib/books
    expose: ["3000"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [isolated]

  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        VCS_REF: ${BELIB_STAGE_VCS_REF:?Set full reviewed staging SHA}
        VITE_API_BASE_URL: http://127.0.0.1:${BELIB_STAGE_PORT:?Set free i5 loopback port}
        VITE_PUBLIC_DEMO_EMAIL: ""
        VITE_PUBLIC_DEMO_PASSWORD: ""
        VITE_PUBLIC_DEMO_ADMIN_EMAIL: ""
        VITE_PUBLIC_DEMO_ADMIN_PASSWORD: ""
    expose: ["8080"]
    restart: unless-stopped
    networks: [isolated]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${BELIB_STAGE_PORT:?Set free i5 loopback port}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    restart: unless-stopped
    networks: [isolated]

networks:
  isolated: {}

volumes:
  staging-postgres-data: {}
  staging-book-files: {}
