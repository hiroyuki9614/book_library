# Standalone, explicitly selected non-production Compose project.
# Never combine this file with compose.yaml or production env files.
name: belib-isolated-i5

services:
  db:
    image: postgres:16.14-bookworm@sha256:714b08dd70c05160db032e4321033ac4e5b6328935b2d03ed419c3a898aa8219
    platform: linux/amd64
    environment:
      POSTGRES_USER: belib_staging_bootstrap
      POSTGRES_DB: belib_staging
      POSTGRES_PASSWORD: ${BELIB_STAGE_DB_BOOTSTRAP_PASSWORD:?Set staging-only bootstrap password}
      BELIB_STAGE_DB_APP_PASSWORD: ${BELIB_STAGE_DB_APP_PASSWORD:?Set staging-only app password}
      BELIB_STAGE_DB_MIGRATE_PASSWORD: ${BELIB_STAGE_DB_MIGRATE_PASSWORD:?Set staging-only migration password}
    volumes:
      - staging-postgres-data:/var/lib/postgresql/data
      - ./scripts/staging/10-belib-staging-roles.sh:/docker-entrypoint-initdb.d/10-belib-staging-roles.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(psql -X -w -U belib_staging_app -d belib_staging -tAc
          "SELECT 1 WHERE current_user = 'belib_staging_app'
          AND shobj_description((SELECT oid FROM pg_database WHERE datname = current_database()), 'pg_database') = 'belib-staging-role-bootstrap-v1'
          AND EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'belib_staging_app' AND rolcanlogin AND NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole AND NOT rolreplication AND NOT rolbypassrls AND NOT rolinherit)
          AND EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'belib_staging_migrate' AND rolcanlogin AND NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole AND NOT rolreplication AND NOT rolbypassrls AND NOT rolinherit)
          AND has_database_privilege(current_user, current_database(), 'CONNECT')
          AND NOT has_database_privilege(current_user, current_database(), 'CREATE')
          AND NOT has_database_privilege(current_user, current_database(), 'TEMPORARY')
          AND has_schema_privilege(current_user, 'public', 'USAGE')
          AND NOT has_schema_privilege(current_user, 'public', 'CREATE')
          AND (SELECT nspowner = (SELECT oid FROM pg_roles WHERE rolname = 'belib_staging_migrate') FROM pg_namespace WHERE nspname = 'public')")" = "1"
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [isolated]

  migrate:
    profiles: ["migration"]
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: ../scripts/staging/Dockerfile.backend.staging
      target: migration
    user: node
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://belib_staging_migrate:${BELIB_STAGE_DB_MIGRATE_PASSWORD:?Set staging-only migration password}@db:5432/belib_staging
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [isolated]

  backend:
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: ../scripts/staging/Dockerfile.backend.staging
      target: runtime
      args:
        VCS_REF: ${BELIB_STAGE_VCS_REF:?Set full reviewed staging SHA}
    user: node
    environment:
      DATABASE_URL: postgresql://belib_staging_app:${BELIB_STAGE_DB_APP_PASSWORD:?Set staging-only app password}@db:5432/belib_staging
      APP_PORT: "3000"
      ENVIRONMENT: test
      FRONTEND_URL: https://stg-bl.hiroyuki9614.com
      BETTER_AUTH_URL: https://stg-bl.hiroyuki9614.com
      BETTER_AUTH_SECRET: ${BELIB_STAGE_AUTH_SECRET:?Set staging-only Better Auth secret}
      BOOK_FILE_STORAGE_DRIVER: local
      BOOK_FILE_STORAGE_ROOT: /home/node/books
      NPM_CONFIG_CACHE: /tmp/npm-cache
      # No R2 settings: synthetic books stay on this isolated local volume.
    volumes:
      # Empty-volume copy-up preserves the pre-existing node-owned home directory metadata.
      - staging-book-files:/home/node
    expose: ["3000"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [isolated]

  frontend:
    platform: linux/amd64
    build:
      context: ./frontend
      dockerfile: ../scripts/staging/Dockerfile.frontend.staging
      target: runtime
      args:
        VCS_REF: ${BELIB_STAGE_VCS_REF:?Set full reviewed staging SHA}
        VITE_API_BASE_URL: https://stg-bl.hiroyuki9614.com
        VITE_PUBLIC_DEMO_EMAIL: ""
        VITE_PUBLIC_DEMO_PASSWORD: ""
        VITE_PUBLIC_DEMO_ADMIN_EMAIL: ""
        VITE_PUBLIC_DEMO_ADMIN_PASSWORD: ""
    expose: ["8080"]
    restart: unless-stopped
    networks: [isolated]

  nginx:
    image: nginx:1.27-alpine@sha256:62223d644fa234c3a1cc785ee14242ec47a77364226f1c811d2f669f96dc2ac8
    platform: linux/amd64
    ports:
      - "127.0.0.1:${BELIB_STAGE_PORT:?Set free i5 loopback port}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./scripts/staging/nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    restart: unless-stopped
    networks: [isolated]

networks:
  isolated:
    internal: true

volumes:
  staging-postgres-data: {}
  staging-book-files: {}
