openapi: 3.0.3
info:
  title: BeLib Implemented API
  version: 0.9.0
  description: |
    BeLibで現在実装されている /api/v1 HTTP contract を記録する。
    将来の正式要件や未実装endpointは docs/requirements.md と docs/mvp_plan.md を参照する。
    認証はBetter AuthのCookie sessionを使用する。
    Book fileは現在protected local storageで保持し、Cloudflare R2への正式cutoverは未実装。
servers:
  - url: http://localhost:3000/api/v1
    description: Local backend

paths:
  /me:
    get:
      summary: 認証中のユーザーを取得
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /books:
    get:
      summary: 閲覧権限のある書籍一覧を取得
      description: |
        RoleBookPermissionで現在ユーザーのroleに許可された、論理削除されていない書籍だけを返す。
        一覧のreadStatusは現在ユーザーのReadingInfoから取得する。
        EPUBとPDFの両方が存在する場合はEPUBを優先する。
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: q
          in: query
          description: タイトルまたは著者名の部分一致検索。最大100文字。
          schema:
            type: string
            maxLength: 100
        - name: categoryId
          in: query
          description: categoryIdによる絞り込み。
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Authorized books
          content:
            application/json:
              schema:
                type: object
                required: [total, page, limit, books]
                properties:
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  books:
                    type: array
                    items:
                      $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /books/{bookId}:
    parameters:
      - $ref: '#/components/parameters/BookId'
    get:
      summary: 閲覧権限のある書籍詳細を取得
      responses:
        '200':
          description: Book detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BookNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /books/{bookId}/file:
    parameters:
      - $ref: '#/components/parameters/BookId'
    get:
      summary: 認可済みEPUB/PDFを取得
      description: |
        protected local storageからbackend経由でstreamする。
        EPUBとPDFが両方存在する場合はEPUBを優先する。
        Cloudflare R2 / signed URLへの正式cutoverは未実装。
      responses:
        '200':
          description: Protected EPUB or PDF stream
          headers:
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/epub+zip:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FileNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /books/{bookId}/reading-info:
    parameters:
      - $ref: '#/components/parameters/BookId'
    get:
      summary: 現在ユーザーの読書情報を取得
      description: |
        currentPositionはPDFではページ番号文字列、EPUBではCFIを保持できる。
        numeric currentPositionの場合は互換用currentPageにも復元する。
      responses:
        '200':
          description: Reading info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BookNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      summary: PDFページまたはEPUB CFIと読書状態を保存
      description: |
        currentPageまたはcurrentPositionのどちらか一方だけを受け取る。
        currentPageは既存PDF caller互換。
        readStatusを省略した場合はreading。明示値はreadingまたはcompleted。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/PdfReadingInfoUpdateRequest'
                - $ref: '#/components/schemas/EpubReadingInfoUpdateRequest'
      responses:
        '200':
          description: Saved reading info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingInfo'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BookNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/categories:
    get:
      summary: 管理者が登録フォーム用のactiveカテゴリを取得
      responses:
        '200':
          description: Active categories
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: 管理者がカテゴリを追加
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCategoryMutationRequest'
      responses:
        '201':
          description: Created category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategory'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    patch:
      summary: 管理者がカテゴリ名を変更
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCategoryMutationRequest'
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategory'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/categories/{categoryId}/delete:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    patch:
      summary: 管理者がカテゴリをinactive化
      description: 使用中の書籍は固定の未分類カテゴリへ移動する。
      responses:
        '200':
          description: Deactivated category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategoryDeletionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/books:
    get:
      summary: 管理者が保存済み書籍一覧を取得
      description: |
        state=active（既定）またはstate=deletedの書籍をcreatedAt降順で返す。
        category、先頭BookFile、RoleBookPermissionから復元したpublicationScopeを含む。
        legacy metadata-only書籍はfile=nullで返す。
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [active, deleted]
            default: active
      responses:
        '200':
          description: Persisted admin books
          content:
            application/json:
              schema:
                type: object
                required: [books]
                properties:
                  books:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminBookSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: 管理者がメタデータだけを登録する互換endpoint
      description: |
        既存vertical-slice caller互換のため維持する。
        新しいAdmin UIの完全登録は /admin/book-registrations を使用する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminBookCreateRequest'
      responses:
        '201':
          description: Created book metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookCreateResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/book-registrations:
    post:
      summary: 管理者が書籍情報とEPUB/PDFを一括登録
      description: |
        title、active categoryId、publicationScope、EPUB/PDF fileを必須とする。
        最大200MB。拡張子・MIME・内容を検証し、SHA-256 hashで重複を拒否する。
        現在はprotected local storageへ保存し、Book + BookFile + RoleBookPermissionをnested createする。
        DB create失敗時は直前に保存したlocal fileを削除する。
        Cloudflare R2への正式cutoverは未実装。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminBookRegistrationRequest'
      responses:
        '201':
          description: Created book, file, and publication scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookRegistrationResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/FileTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/books/{bookId}:
    parameters:
      - $ref: '#/components/parameters/BookId'
    patch:
      summary: 管理者が書籍情報と公開範囲を更新
      description: 書籍ファイルとReadingInfoは変更しない。削除済み書籍は編集できない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminBookMetadataUpdateRequest'
      responses:
        '200':
          description: Updated book metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookMetadataUpdateResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BookNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/books/{bookId}/delete:
    parameters:
      - $ref: '#/components/parameters/BookId'
    patch:
      summary: 管理者が書籍を論理削除
      description: deletedAtだけを更新し、ファイルとReadingInfoは保持する。
      responses:
        '200':
          description: Deleted book state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookDeletionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BookNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/books/{bookId}/restore:
    parameters:
      - $ref: '#/components/parameters/BookId'
    patch:
      summary: 管理者が論理削除した書籍を復元
      responses:
        '200':
          description: Restored book state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookDeletionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BookNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/books/{bookId}/files:
    parameters:
      - $ref: '#/components/parameters/BookId'
    post:
      summary: 管理者が既存書籍へEPUB/PDFを登録
      description: |
        EPUB/PDF、最大200MB。拡張子・MIME・内容とSHA-256 hashを検証する。
        MVPでは1冊1fileを強制し、既存fileまたは重複hashは409を返す。
        protected local storageへ保存後にBookFileを作成し、DB失敗時は新規local fileを削除する。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Created BookFile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookFile'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BookNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/FileTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/users:
    get:
      summary: 管理者が一般ユーザー一覧を取得
      responses:
        '200':
          description: General users including disabled users
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: 管理者が一般ユーザーを登録
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserCreateRequest'
      responses:
        '201':
          description: Created general user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/users/{userId}/disable:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      summary: 管理者が一般ユーザーを利用停止
      description: deletedAtを設定し、既存sessionとReadingInfoは保持する。
      responses:
        '200':
          description: Disabled user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserStateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/users/{userId}/restore:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      summary: 管理者が利用停止中の一般ユーザーを再開
      responses:
        '200':
          description: Restored user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserStateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/users/{userId}/password:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      summary: 管理者が一般ユーザーの仮パスワードを再設定
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPasswordResetRequest'
      responses:
        '200':
          description: Password reset result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPasswordResetResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    BookId:
      name: bookId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  responses:
    InvalidRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BookNotFound:
      description: Book not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FileNotFound:
      description: Supported book file not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CategoryNotFound:
      description: Category not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UserNotFound:
      description: User not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Duplicate file content or one-file-per-book conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FileTooLarge:
      description: File exceeds the 200MB limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true

  schemas:
    Error:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
        code:
          type: string

    CurrentUser:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string

    AdminUser:
      type: object
      required: [id, email, name, deletedAt, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        deletedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    AdminUserCreateRequest:
      type: object
      required: [email, name, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          minLength: 8

    AdminUserStateResponse:
      type: object
      required: [id, email, name, deletedAt]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        deletedAt:
          type: string
          format: date-time
          nullable: true

    AdminPasswordResetRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password:
          type: string
          minLength: 8

    AdminPasswordResetResponse:
      type: object
      required: [id, passwordReset]
      properties:
        id:
          type: integer
        passwordReset:
          type: boolean
          enum: [true]

    CategorySummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    AdminCategory:
      type: object
      required: [id, name, displayOrder, isActive]
      properties:
        id:
          type: integer
        name:
          type: string
        displayOrder:
          type: integer
        isActive:
          type: boolean

    AdminCategoryMutationRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    AdminCategoryDeletionResponse:
      type: object
      required: [movedBookCount, category]
      properties:
        movedBookCount:
          type: integer
          minimum: 0
        category:
          type: object
          required: [id, name, isActive]
          properties:
            id:
              type: integer
            name:
              type: string
            isActive:
              type: boolean

    Book:
      type: object
      required: [id, title, category, pageTurnDirection, readStatus, hasFile, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        authorName:
          type: string
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
        publisher:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        category:
          $ref: '#/components/schemas/CategorySummary'
        pageTurnDirection:
          type: string
          enum: [ltr, rtl]
        readStatus:
          type: string
          enum: [unread, reading, completed]
          description: Current user's persisted ReadingInfo state for list/detail responses.
        hasFile:
          type: boolean
        fileType:
          type: string
          enum: [pdf, epub]
          nullable: true
          description: EPUB is preferred when both supported formats are present.
        fileSize:
          type: integer
          nullable: true
        originalFileName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReadingInfo:
      type: object
      required: [bookId, currentPosition, currentPage, readStatus]
      properties:
        bookId:
          type: integer
        currentPosition:
          type: string
          maxLength: 255
          nullable: true
          description: PDF page number string or EPUB CFI.
        currentPage:
          type: integer
          minimum: 1
          description: Numeric compatibility projection; EPUB CFI returns 1 here.
        readStatus:
          type: string
          enum: [unread, reading, completed]

    PdfReadingInfoUpdateRequest:
      type: object
      required: [currentPage]
      additionalProperties: false
      properties:
        currentPage:
          type: integer
          minimum: 1
        readStatus:
          type: string
          enum: [reading, completed]
          default: reading

    EpubReadingInfoUpdateRequest:
      type: object
      required: [currentPosition]
      additionalProperties: false
      properties:
        currentPosition:
          type: string
          minLength: 1
          maxLength: 255
          description: EPUB CFI or another supported textual reading position.
        readStatus:
          type: string
          enum: [reading, completed]
          default: reading

    AdminBookCreateRequest:
      type: object
      required: [title, categoryId]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        authorName:
          type: string
          nullable: true
        publisher:
          type: string
          nullable: true
        publishedAt:
          type: string
          format: date
          nullable: true
        categoryId:
          type: integer
          minimum: 1
        pageTurnDirection:
          type: string
          enum: [ltr, rtl]
        description:
          type: string
          nullable: true

    AdminBookCreateResponse:
      type: object
      required: [id, title, categoryId]
      properties:
        id:
          type: integer
        title:
          type: string
        authorName:
          type: string
          nullable: true
        publisher:
          type: string
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
        categoryId:
          type: integer
        pageTurnDirection:
          type: string
          enum: [ltr, rtl]
        description:
          type: string
          nullable: true
        category:
          $ref: '#/components/schemas/CategorySummary'

    AdminBookSummary:
      allOf:
        - $ref: '#/components/schemas/AdminBookCreateResponse'
        - type: object
          required: [deletedAt, publicationScope, file]
          properties:
            deletedAt:
              type: string
              format: date-time
              nullable: true
            publicationScope:
              type: string
              enum: [all_users, admin_only]
            file:
              allOf:
                - $ref: '#/components/schemas/AdminBookFileSummary'
              nullable: true

    AdminBookMetadataUpdateRequest:
      type: object
      required: [title, categoryId, pageTurnDirection, publicationScope]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        authorName:
          type: string
          nullable: true
        publisher:
          type: string
          nullable: true
        publishedAt:
          type: string
          format: date
          nullable: true
        categoryId:
          type: integer
          minimum: 1
        pageTurnDirection:
          type: string
          enum: [ltr, rtl]
        description:
          type: string
          nullable: true
        publicationScope:
          type: string
          enum: [all_users, admin_only]

    AdminBookMetadataUpdateResponse:
      allOf:
        - $ref: '#/components/schemas/AdminBookCreateResponse'
        - type: object
          required: [deletedAt, publicationScope]
          properties:
            deletedAt:
              type: string
              format: date-time
              nullable: true
            publicationScope:
              type: string
              enum: [all_users, admin_only]

    AdminBookDeletionResponse:
      type: object
      required: [id, deletedAt]
      properties:
        id:
          type: integer
        deletedAt:
          type: string
          format: date-time
          nullable: true

    AdminBookRegistrationRequest:
      type: object
      required: [title, categoryId, publicationScope, file]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        authorName:
          type: string
        publisher:
          type: string
        publishedAt:
          type: string
          format: date
        categoryId:
          type: integer
          minimum: 1
        pageTurnDirection:
          type: string
          enum: [ltr, rtl]
          default: ltr
        description:
          type: string
        publicationScope:
          type: string
          enum: [all_users, admin_only]
          description: Required; no default.
        file:
          type: string
          format: binary
          description: EPUB or PDF, maximum 200MB.

    AdminBookRegistrationResponse:
      allOf:
        - $ref: '#/components/schemas/AdminBookCreateResponse'
        - type: object
          required: [publicationScope, file]
          properties:
            publicationScope:
              type: string
              enum: [all_users, admin_only]
            file:
              $ref: '#/components/schemas/AdminBookFileSummary'

    AdminBookFileSummary:
      type: object
      required: [id, extension, mimeType, originalFileName, fileSize]
      properties:
        id:
          type: integer
        extension:
          type: string
          enum: [pdf, epub]
        mimeType:
          type: string
          enum: [application/pdf, application/epub+zip]
        originalFileName:
          type: string
        fileSize:
          type: integer

    BookFile:
      type: object
      required: [id, extension, mimeType, fileUrl, originalFileName, storedFileName, fileSize, fileHash, bookId, createdAt, updatedAt]
      properties:
        id:
          type: integer
        extension:
          type: string
          enum: [pdf, epub]
        mimeType:
          type: string
          enum: [application/pdf, application/epub+zip]
        fileUrl:
          type: string
          description: Current implementation stores a protected local relative key, not a public URL.
        originalFileName:
          type: string
        storedFileName:
          type: string
        fileSize:
          type: integer
        fileHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        bookId:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
