upstream belib_backend {
    server backend:3000;
}

upstream belib_frontend {
    server frontend:8080;
}

# The host's separately approved HTTPS ingress proxies to this loopback-only
# listener. Do not trust client-supplied forwarding metadata: the canonical
# host and HTTPS scheme are set below, and alternative metadata is discarded.
server {
    listen 8080 default_server;
    server_name "";
    return 444;
}

server {
    listen 8080;
    server_name stg-bl.hiroyuki9614.com 127.0.0.1 localhost;

    client_max_body_size 210m;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location /api/ {
        proxy_pass http://belib_backend;
        proxy_http_version 1.1;
        proxy_set_header Host stg-bl.hiroyuki9614.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host stg-bl.hiroyuki9614.com;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Forwarded "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /health {
        proxy_pass http://belib_backend;
        proxy_http_version 1.1;
        proxy_set_header Host stg-bl.hiroyuki9614.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host stg-bl.hiroyuki9614.com;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://belib_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host stg-bl.hiroyuki9614.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host stg-bl.hiroyuki9614.com;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
