upstream belib_backend {
    server backend:3000;
}

upstream belib_frontend {
    server frontend:8080;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Keep the existing loopback HTTP endpoint available for local health checks.
server {
    listen 8080 default_server;
    server_name "";
    return 444;
}

server {
    listen 8080;
    server_name stg-bl.hiroyuki9614.com 127.0.0.1 localhost;
    include /etc/nginx/conf.d/belib-proxy-locations.conf;
}

# The stream SNI map sends only the approved custom hostname here. Unknown SNI
# is sent to a closed loopback port before any TLS certificate is presented.
server {
    listen 8444 ssl;
    server_name stg-bl.hiroyuki9614.com;
    ssl_certificate /run/belib-tls/fullchain.pem;
    ssl_certificate_key /run/belib-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/conf.d/belib-proxy-locations.conf;
}
